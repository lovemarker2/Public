<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>모두의 사회서비스</title>
<meta name="description" content="내 주변 사회서비스를 한눈에 — 생애주기별 통합 검색">
<meta property="og:title" content="모두의 사회서비스">
<meta property="og:description" content="생애주기별 내 주변 사회서비스 통합 검색">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.4.0/dist/tabler-icons.min.css">
<style>

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --g:#1A6B3C;--g2:#0F4A28;--gl:#E8F5EE;
  --t:#111;--t2:#555;--t3:#999;
  --bd:rgba(0,0,0,0.09);--bd2:rgba(0,0,0,0.16);
  --bg:#F5F7F5;--card:#fff;
  --r:14px;
}
@media(prefers-color-scheme:dark){
  :root{--t:#e8f0e8;--t2:#8fa88f;--t3:#567056;--bd:rgba(255,255,255,0.1);--bd2:rgba(255,255,255,0.2);--bg:#111811;--card:#182018}
}
html{font-family:-apple-system,'Malgun Gothic','맑은 고딕',sans-serif;color:var(--t);background:var(--bg)}
body{min-height:100vh}
button{font-family:inherit;cursor:pointer;border:none}
input{font-family:inherit;border:none;outline:none}
/* LANDING */
#landing{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:24px 20px;transition:opacity .25s,transform .25s}
#landing.gone{opacity:0;transform:translateY(-24px);pointer-events:none;position:absolute;top:0;width:100%}
.logo-mark{width:60px;height:60px;background:var(--g);border-radius:16px;display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
.logo-mark i{font-size:32px;color:#fff}
.logo-title{font-size:30px;font-weight:700;color:var(--g);letter-spacing:-1px;text-align:center}
.logo-sub{font-size:13px;color:var(--t3);margin-top:5px;text-align:center}
.sbox{width:100%;max-width:540px;margin-top:28px;background:var(--card);border:1.5px solid var(--bd2);border-radius:32px;display:flex;align-items:center;padding:4px 6px 4px 18px;box-shadow:0 2px 14px rgba(0,0,0,0.07);transition:border-color .15s,box-shadow .15s}
.sbox:focus-within{border-color:var(--g);box-shadow:0 2px 18px rgba(26,107,60,0.14)}
.sbox input{flex:1;font-size:15px;background:transparent;color:var(--t);padding:10px 0}
.sbox input::placeholder{color:var(--t3)}
.sbox button{background:var(--g);border-radius:24px;width:40px;height:40px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;flex-shrink:0;transition:background .15s}
.sbox button:hover{background:var(--g2)}
.gps-btn{display:inline-flex;align-items:center;gap:6px;margin-top:12px;padding:8px 18px;border-radius:24px;border:1px solid var(--bd2);background:var(--card);font-size:13px;color:var(--t2);cursor:pointer;transition:all .15s}
.gps-btn:hover{border-color:var(--g);color:var(--g)}
.gps-btn.busy{opacity:.7;pointer-events:none}
.gps-btn i{font-size:15px;color:var(--g)}
.lc-section{width:100%;max-width:540px;margin-top:26px}
.lc-label{font-size:11px;color:var(--t3);font-weight:600;letter-spacing:.5px;text-transform:uppercase;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.lc-label::after{content:"";flex:1;height:1px;background:var(--bd)}
.lc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media(max-width:440px){.lc-grid{grid-template-columns:repeat(3,1fr)}}
.lc-btn{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 8px;text-align:center;cursor:pointer;transition:all .15s}
.lc-btn:hover{border-color:var(--g);background:var(--gl)}
.lc-btn i{font-size:22px;display:block;margin-bottom:5px}
.lc-btn b{font-size:12px;font-weight:600;color:var(--t2);display:block}
.lc-btn small{font-size:10px;color:var(--t3);display:block;margin-top:1px}
/* TOP BAR */
#results{display:none}
#results.show{display:block}
.topbar{position:sticky;top:0;z-index:200;background:var(--card);border-bottom:1px solid var(--bd);padding:9px 12px;display:flex;align-items:center;gap:10px}
.tlogo{font-size:15px;font-weight:700;color:var(--g);cursor:pointer;white-space:nowrap;flex-shrink:0;display:flex;align-items:center;gap:4px}
.tlogo i{font-size:17px}
.tbox{flex:1;background:var(--bg);border:1.5px solid var(--bd);border-radius:22px;display:flex;align-items:center;padding:0 10px;gap:7px;transition:border-color .15s}
.tbox:focus-within{border-color:var(--g)}
.tbox i{font-size:14px;color:var(--t3);flex-shrink:0}
.tbox input{flex:1;font-size:13px;background:transparent;color:var(--t);padding:8px 0}
.tbox input::placeholder{color:var(--t3)}
.tbox button{background:none;padding:3px;color:var(--t3);font-size:14px;display:flex;align-items:center}
.share-btn{background:none;border:1px solid var(--bd);border-radius:8px;padding:6px 10px;font-size:12px;color:var(--t2);display:flex;align-items:center;gap:4px;white-space:nowrap;transition:all .15s;flex-shrink:0}
.share-btn:hover{border-color:var(--g);color:var(--g)}
.share-btn i{font-size:13px}
/* FILTER BAR */
.fbar{background:var(--card);border-bottom:1px solid var(--bd);padding:8px 12px;display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;align-items:center}
.fbar::-webkit-scrollbar{display:none}
.fc{flex-shrink:0;padding:5px 11px;border-radius:20px;border:1px solid var(--bd);background:var(--card);font-size:12px;font-weight:500;color:var(--t2);cursor:pointer;transition:all .15s;white-space:nowrap;display:flex;align-items:center;gap:4px}
.fc i{font-size:11px}
.fc.on{background:var(--g);border-color:var(--g);color:#fff;font-weight:600}
.fsep{width:1px;height:18px;background:var(--bd);flex-shrink:0;margin:0 2px}
.fs{flex-shrink:0;padding:5px 10px;border-radius:20px;border:1px solid var(--bd);background:var(--card);font-size:12px;color:var(--t2);cursor:pointer;display:flex;align-items:center;gap:3px;transition:all .15s;white-space:nowrap}
.fs.on{border-color:var(--g);color:var(--g);font-weight:600}
.fs i{font-size:11px}
/* LOC BAR */
.loc-bar{background:var(--gl);border-bottom:1px solid rgba(26,107,60,0.15);padding:7px 14px;font-size:12px;color:#1A6B3C;display:flex;align-items:center;gap:6px}
.loc-bar i{font-size:13px}
.loc-bar.err{background:#FEF2F2;border-color:rgba(220,38,38,0.15);color:#DC2626}
.loc-bar.busy{background:#F0F9FF;border-color:rgba(37,99,235,0.15);color:#2563EB}
/* MAIN */
.main{display:grid;grid-template-columns:1fr 310px;max-width:1040px;margin:0 auto;padding:14px;gap:14px}
@media(max-width:720px){.main{grid-template-columns:1fr}.map-col{display:none}}
.meta{font-size:12px;color:var(--t3);margin-bottom:12px;padding:0 2px}
.meta b{color:var(--g);font-weight:600}
.lst{display:flex;flex-direction:column;gap:8px}
/* CARD */
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);overflow:hidden;cursor:pointer;transition:border-color .15s}
.card:hover{border-color:rgba(26,107,60,.4)}
.card.open{border-color:var(--g)}
.card-top{display:flex;align-items:center;gap:12px;padding:13px 14px}
.rnum{width:30px;height:30px;border-radius:9px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
.cinfo{flex:1;min-width:0}
.cname{font-size:14px;font-weight:600;color:var(--t);margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cname .near{font-size:10px;font-weight:700;color:#059669;background:#D1FAE5;padding:1px 5px;border-radius:4px;margin-right:5px;vertical-align:1px}
.ctype{font-size:12px;color:var(--t3);display:flex;align-items:center;flex-wrap:wrap;gap:5px}
.sbar-wrap{display:flex;align-items:center;gap:6px;margin-top:5px}
.sbar{flex:1;height:3px;background:var(--bd);border-radius:3px;overflow:hidden}
.sbar-f{height:100%;border-radius:3px}
.cright{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0;margin-left:8px}
.dist{font-size:14px;font-weight:700;color:var(--g)}
.dist.far{font-weight:400;color:var(--t3)}
.gb{font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px}
.gS{background:#D1FAE5;color:#065F46}.gA{background:#DBEAFE;color:#1E40AF}
.gB{background:#FEF9C3;color:#92400E}.gC{background:#FEE2E2;color:#991B1B}
.gX{background:var(--bg);color:var(--t3)}
@media(prefers-color-scheme:dark){
  .gS{background:#064E3B;color:#6EE7B7}.gA{background:#1E3A5F;color:#93C5FD}
  .gB{background:#451A03;color:#FDE68A}.gC{background:#450A0A;color:#FCA5A5}
  .gX{background:#222;color:#666}
}
.chv{font-size:14px;color:var(--t3);transition:transform .2s;flex-shrink:0}
.chv.up{transform:rotate(180deg)}
/* DETAIL */
.detail{border-top:1px solid var(--bd);padding:14px}
.dgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-bottom:12px}
.di{background:var(--bg);border-radius:9px;padding:9px 11px}
.dl{font-size:10px;color:var(--t3);margin-bottom:3px;display:flex;align-items:center;gap:3px}
.dl i{font-size:10px}
.dv{font-size:12px;font-weight:500;color:var(--t);line-height:1.4}
.stags{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:12px}
.stag{font-size:11px;padding:3px 8px;border-radius:20px;background:var(--gl);color:var(--g);font-weight:500}
@media(prefers-color-scheme:dark){.stag{background:#0a2a1a;color:#6EE7B7}}
.ebox{background:var(--bg);border-radius:10px;padding:12px 14px;margin-bottom:12px}
.ettl{font-size:10px;color:var(--t3);font-weight:700;margin-bottom:8px}
.erow{display:flex;justify-content:space-between;align-items:flex-end}
.escr{display:flex;align-items:center;gap:7px;margin-top:5px}
.ebar{width:110px;height:5px;background:var(--bd);border-radius:3px;overflow:hidden}
.efill{height:100%;border-radius:3px}
.eg{font-size:26px;font-weight:800;line-height:1}
.cta{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.btn-o{padding:10px;border-radius:10px;border:1.5px solid var(--g);color:var(--g);font-size:12px;font-weight:600;background:none;display:flex;align-items:center;justify-content:center;gap:4px;text-decoration:none;transition:background .15s}
.btn-o:hover{background:var(--gl)}
.btn-f{padding:10px;border-radius:10px;border:none;background:var(--g);color:#fff;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:4px;transition:background .15s}
.btn-f:hover{background:var(--g2)}
/* MAP */
.map-col{position:sticky;top:106px;height:calc(100vh - 126px);max-height:560px}
.map-wrap{width:100%;height:100%;border-radius:var(--r);border:1px solid var(--bd);overflow:hidden}
/* EMPTY */
.empty{text-align:center;padding:60px 20px;color:var(--t3)}
.empty i{font-size:42px;display:block;margin-bottom:12px}
/* TOAST */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:#111;color:#fff;padding:10px 20px;border-radius:24px;font-size:13px;font-weight:500;transition:transform .3s;z-index:999;display:flex;align-items:center;gap:7px;white-space:nowrap}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast i{color:#6EE7B7;font-size:14px}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{animation:spin 1s linear infinite;display:inline-block}

</style>
</head>
<body>

<div id="results">

</div>

<div class="toast" id="toast"><i class="ti ti-check" aria-hidden="true"></i>링크가 복사됐어요</div>

const GC={S:"#059669",A:"#2563EB",B:"#D97706",C:"#DC2626"};
const GO={S:0,A:1,B:2,C:3,D:4};

let selCat="all",selSort="dist",openId=null,searchQ="";
let uLat=null,uLng=null,locSt="none";

function hav(a,b,c,d){
  const R=6371,dA=(c-a)*Math.PI/180,dB=(d-b)*Math.PI/180;
  const x=Math.sin(dA/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(dB/2)**2;
  return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}
function dist(it){
  return uLat?hav(uLat,uLng,it.lat,it.lng):hav(37.787,127.048,it.lat,it.lng);
}
function fmt(d){return d<1?Math.round(d*1000)+"m":d.toFixed(1)+"km"}

function filtered(){
  const q=searchQ.toLowerCase();
  return DATA.filter(d=>{
    if(selCat!=="all"&&!d.cats.includes(selCat))return false;
    if(q&&![d.name,d.type,d.addr,...d.svcs].some(x=>x.toLowerCase().includes(q)))return false;
    return true;
  }).sort((a,b)=>{
    if(selSort==="dist")return dist(a)-dist(b);
    if(selSort==="grade")return(GO[a.eval?.grade]??9)-(GO[b.eval?.grade]??9);
    if(selSort==="score")return(b.eval?.score||0)-(a.eval?.score||0);
    return dist(a)-dist(b);
  });
}

function gbadge(ev){
  if(!ev)return`<span class="gb gX">평가없음</span>`;
  return`<span class="gb g${ev.grade}">${ev.grade}등급</span>`;
}

function buildMap(items){
  const W=310,H=340;
  const bLat=uLat||37.787,bLng=uLng||127.048,sp=0.025;
  const mla=bLat-sp,xla=bLat+sp,mln=bLng-sp*1.2,xln=bLng+sp*1.2;
  const xy=(la,ln)=>({
    x:Math.round(((ln-mln)/(xln-mln))*(W-26)+13),
    y:Math.round(H-((la-mla)/(xla-mla))*(H-26)-13)
  });
  const my=xy(bLat,bLng);
  const grid=[0.2,0.4,0.6,0.8].map(r=>{
    const y=xy(mla+(xla-mla)*r,mln).y;
    const x=xy(mla,mln+(xln-mln)*r).x;
    return`<line x1="7" y1="${y}" x2="${W-7}" y2="${y}" stroke="#C8E4C8" stroke-width=".7"/>
    <line x1="${x}" y1="7" x2="${x}" y2="${H-7}" stroke="#C8E4C8" stroke-width=".7"/>`;
  }).join("");
  const pins=items.map((it)=>{
    const p=xy(it.lat,it.lng);
    const g=it.eval?.grade,c=GC[g]||"#9CA3AF",iS=it.id===openId;
    const nm=it.name.length>6?it.name.slice(0,6)+"…":it.name;
    return`<g onclick="pinClick(${it.id})" style="cursor:pointer">
      ${iS?`<circle cx="${p.x}" cy="${p.y}" r="16" fill="${c}" opacity=".15"/>`:""}
      <circle cx="${p.x}" cy="${p.y}" r="${iS?11:7}" fill="${c}" stroke="white" stroke-width="${iS?2:1.5}"/>
      <text x="${p.x}" y="${p.y+3.5}" text-anchor="middle" font-size="${iS?8:7}" fill="white" font-weight="700" font-family="sans-serif">${g||"?"}</text>
      ${iS?`<rect x="${p.x-29}" y="${p.y-27}" width="58" height="14" rx="3" fill="rgba(10,10,10,.8)"/>
      <text x="${p.x}" y="${p.y-17}" text-anchor="middle" font-size="8" fill="white" font-family="sans-serif">${nm}</text>`:""}
    </g>`;
  }).join("");
  return`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:100%">
    <rect width="${W}" height="${H}" fill="#EDF5ED"/>
    ${grid}${pins}
    <circle cx="${my.x}" cy="${my.y}" r="15" fill="#2563EB" opacity=".12"/>
    <circle cx="${my.x}" cy="${my.y}" r="8" fill="#2563EB" stroke="white" stroke-width="2.5"/>
    <circle cx="${my.x}" cy="${my.y}" r="3" fill="white"/>
    <text x="${my.x+11}" y="${my.y+4}" font-size="8" fill="#2563EB" font-family="sans-serif" font-weight="700">내 위치</text>
    <rect x="5" y="${H-17}" width="157" height="12" rx="3" fill="rgba(255,255,255,.9)"/>
    <text x="9" y="${H-8}" font-size="7.5" fill="#4A7A52" font-family="sans-serif">S초록·A파랑·B주황·C빨강·없음회색</text>
  </svg>`;
}
window.pinClick=function(id){
  openId=openId===id?null:id;writeURL();render();
  if(openId)setTimeout(()=>{const el=document.querySelector(`[data-cid="${id}"]`);if(el)el.scrollIntoView({behavior:"smooth",block:"nearest"});},60);
};

function cardHTML(it,rank){
  const isO=it.id===openId,d=dist(it),isN=rank===0&&selSort==="dist";
  const g=it.eval?.grade,s=it.eval?.score||0,c=GC[g]||"#ccc";
  const rnk=rank===0?"background:#D1FAE5;color:#065F46":rank===1?"background:#DBEAFE;color:#1E40AF":rank===2?"background:#FEF9C3;color:#92400E":"background:var(--bg);color:var(--t3)";
  const det=isO?`<div class="detail">
    <div class="dgrid">
      <div class="di"><div class="dl"><i class="ti ti-map-pin"></i>주소</div><div class="dv" style="font-size:11px">${it.addr}</div></div>
      <div class="di"><div class="dl"><i class="ti ti-phone"></i>전화</div><div class="dv">${it.phone}</div></div>
      <div class="di"><div class="dl"><i class="ti ti-clock"></i>운영</div><div class="dv">${it.hours}</div></div>
      <div class="di"><div class="dl"><i class="ti ti-tag"></i>유형</div><div class="dv">${it.type}</div></div>
    </div>
    <div class="stags">${it.svcs.map(sv=>`<span class="stag">${sv}</span>`).join("")}</div>
    <div class="ebox">
      <div class="ettl">평가 결과</div>
      ${it.eval?`<div class="erow">
        <div><small style="font-size:11px;color:var(--t3)">${it.eval.year}년도 · ${it.eval.src}</small>
        <div class="escr"><div class="ebar"><div class="efill" style="width:${s}%;background:${c}"></div></div>
        <span style="font-size:12px;font-weight:600;color:${c}">${s}점</span></div></div>
        <div class="eg" style="color:${c}">${g}</div>
      </div>`:`<div style="font-size:12px;color:var(--t3)">평가 이력이 없는 기관입니다.</div>`}
    </div>
    <div class="cta">
      <a href="https://bokjiro.go.kr" target="_blank" class="btn-o"><i class="ti ti-external-link"></i>복지로</a>
      <button class="btn-f" onclick="window.open('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent('${it.name.replace(/'/g,"\\'")} ${it.addr}'))"><i class="ti ti-map"></i>지도 열기</button>
    </div>
  </div>`:"";
  return`<div class="card${isO?" open":""}" data-cid="${it.id}" onclick="cardClick(${it.id})">
    <div class="card-top">
      <div class="rnum" style="${rnk}">${rank+1}</div>
      <div class="cinfo">
        <div class="cname">${isN?'<span class="near">가장 가까워요</span>':""}${it.name}</div>
        <div class="ctype">${it.type}${it.eval?`<span>·</span><span style="font-size:11px;font-weight:600;color:${c}">${g}등급 ${s}점</span><span style="font-size:10px;color:var(--t3)">${it.eval.year}년</span>`:""}</div>
        ${it.eval?`<div class="sbar-wrap"><div class="sbar"><div class="sbar-f" style="width:${s}%;background:${c}"></div></div></div>`:""}
      </div>
      <div class="cright">
        <span class="dist${d>3?" far":""}">${fmt(d)}</span>
        ${gbadge(it.eval)}
        <i class="ti ti-chevron-down chv${isO?" up":""}"></i>
      </div>
    </div>${det}
  </div>`;
}
window.cardClick=function(id){openId=openId===id?null:id;writeURL();render();};

function setLocBar(type,txt){
  const el=document.getElementById("locBar");
  el.style.display="flex";
  const ic=type==="ok"?"ti-map-pin":type==="busy"?'ti-loader" style="animation:spin 1s linear infinite':"ti-alert-triangle";
  el.className="loc-bar"+(type==="err"?" err":type==="busy"?" busy":"");
  el.innerHTML=`<i class="ti ${ic}"></i>${txt}`;
}

function render(){
  const items=filtered();
  const locNote=uLat?`실제 내 위치(${uLat.toFixed(3)},${uLng.toFixed(3)}) 기준`:"샘플 위치 기준";
  document.getElementById("meta").innerHTML=
    `<b>${searchQ?`"${searchQ}" `:""}${selCat!=="all"?`[${[...LC,...AA].find(x=>x.id===selCat)?.label||selCat}] `:""}</b><b>${items.length}개</b> 기관 · ${locNote} 가까운 순`;
  document.getElementById("lst").innerHTML=items.length
    ?items.map((it,i)=>cardHTML(it,i)).join("")
    :`<div class="empty"><i class="ti ti-search-off"></i><p style="font-size:14px;font-weight:500">결과가 없습니다</p><span style="font-size:12px">다른 키워드로 검색해보세요</span></div>`;
  document.getElementById("mapWrap").innerHTML=buildMap(items);
  document.querySelectorAll(".fc").forEach(el=>el.classList.toggle("on",el.dataset.cat===selCat));
  document.querySelectorAll(".fs").forEach(el=>el.classList.toggle("on",el.dataset.srt===selSort));
  document.getElementById("topInput").value=searchQ;
}

function doGPS(fromLanding){
  const lbl=document.getElementById("gpsLabel");
  const btn=document.getElementById("gpsBtn");
  btn.classList.add("busy"); lbl.textContent="위치 확인 중...";
  setLocBar("busy","현재 위치를 가져오는 중입니다...");
  if(!navigator.geolocation){
    btn.classList.remove("busy"); lbl.textContent="위치 서비스 미지원";
    setLocBar("err","이 브라우저는 위치 서비스를 지원하지 않습니다.");
    if(fromLanding)showResults();
    return;
  }
  navigator.geolocation.getCurrentPosition(
    pos=>{
      uLat=pos.coords.latitude; uLng=pos.coords.longitude;
      btn.classList.remove("busy"); lbl.textContent="위치 확인됨 ✓";
      setLocBar("ok",`내 위치 확인됨 — 위도 ${uLat.toFixed(4)}, 경도 ${uLng.toFixed(4)} 기준으로 거리를 계산합니다`);
      if(fromLanding)showResults();
      else render();
    },
    err=>{
      btn.classList.remove("busy"); lbl.textContent="위치 권한 필요";
      const m=err.code===1?"위치 권한이 거부됐습니다. 브라우저 주소창 왼쪽 자물쇠 아이콘에서 위치를 허용해주세요."
              :err.code===2?"위치를 가져올 수 없습니다."
              :"위치 요청이 시간 초과됐습니다.";
      setLocBar("err",m);
      if(fromLanding)showResults();
    },
    {timeout:10000,enableHighAccuracy:true}
  );
}

function showResults(){
  document.getElementById("landing").classList.add("gone");
  document.getElementById("results").classList.add("show");
  writeURL(); render();
  if(locSt==="none"){locSt="started"; doGPS(false);}
}
function goHome(){
  document.getElementById("landing").classList.remove("gone");
  document.getElementById("results").classList.remove("show");
  document.getElementById("locBar").style.display="none";
  history.replaceState(null,"",location.pathname);
}
function writeURL(){
  const p=new URLSearchParams();
  if(searchQ)p.set("q",searchQ);
  if(selCat!=="all")p.set("cat",selCat);
  if(selSort!=="dist")p.set("sort",selSort);
  if(openId)p.set("open",openId);
  history.replaceState(null,"","?"+p.toString());
}
function readURL(){
  const p=new URLSearchParams(location.search);
  searchQ=p.get("q")||""; selCat=p.get("cat")||"all";
  selSort=p.get("sort")||"dist"; openId=p.get("open")?parseInt(p.get("open")):null;
  return !!(searchQ||selCat!=="all"||openId);
}

// Build filter bar
function buildFbar(){
  const bar=document.getElementById("fbar");
  [{id:"all",label:"전체",icon:"ti-apps"},...LC,...AA].forEach(c=>{
    const b=document.createElement("button");
    b.className="fc"+(selCat===c.id?" on":"");
    b.dataset.cat=c.id;
    b.innerHTML=`<i class="ti ${c.icon}"></i>${c.label}`;
    b.onclick=()=>{selCat=c.id;openId=null;writeURL();render();};
    bar.appendChild(b);
  });
  const sep=document.createElement("div");sep.className="fsep";bar.appendChild(sep);
  [{sort:"dist",icon:"ti-map-pin",label:"가까운 순"},
   {sort:"grade",icon:"ti-award",label:"등급 순"},
   {sort:"score",icon:"ti-chart-bar",label:"점수 순"}].forEach(s=>{
    const b=document.createElement("button");
    b.className="fs"+(selSort===s.sort?" on":"");
    b.dataset.srt=s.sort;
    b.innerHTML=`<i class="ti ${s.icon}"></i>${s.label}`;
    b.onclick=()=>{selSort=s.sort;writeURL();render();};
    bar.appendChild(b);
  });
}
// Build landing grids
function buildGrids(){
  const lc=document.getElementById("lcGrid"),aa=document.getElementById("aaGrid");
  LC.forEach(c=>{
    const d=document.createElement("div");d.className="lc-btn";
    d.innerHTML=`<i class="ti ${c.icon}" style="color:${c.c}"></i><b>${c.label}</b><small>${c.sub}</small>`;
    d.onclick=()=>{selCat=c.id;showResults();};
    lc.appendChild(d);
  });
  AA.forEach(c=>{
    const d=document.createElement("div");d.className="lc-btn";
    d.innerHTML=`<i class="ti ${c.icon}" style="color:${c.c}"></i><b>${c.label}</b><small>${c.sub}</small>`;
    d.onclick=()=>{selCat=c.id;showResults();};
    aa.appendChild(d);
  });
}

    const t=document.createElement("textarea");t.value=url;document.body.appendChild(t);t.select();document.execCommand("copy");document.body.removeChild(t);
  })).then(()=>{const el=document.getElementById("toast");el.classList.add("show");setTimeout(()=>el.classList.remove("show"),2400);});
};
buildGrids();buildFbar();
if(readURL())showResults();

</script>
